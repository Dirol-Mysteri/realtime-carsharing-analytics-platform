version: 2

models:
  - name: fct_trips
    description: "Таблица фактов завершенных поездок каршеринга. Содержит агрегированные метрики по времени, скорости и расходу топлива."
    columns:
      - name: trip_id
        description: "Уникальный идентификатор поездки (Первичный ключ)."
        tests:
          - unique       # Проверка 1: Каждая поездка должна быть в единственном экземпляре (без дублей)
          - not_null     # Проверка 2: Идентификатор поездки не может быть пустым
          
      - name: car_id
        description: "Идентификатор автомобиля."
        tests:
          - not_null     # Проверка 3: У каждой поездки обязана быть машина
          
      - name: trip_duration_minutes
        description: "Длительность поездки в минутах."
        tests:
          # Проверка 4: Кастомный тест на валидность данных (длительность не может быть отрицательной)
          - dbt_utils.expression_is_true:
              expression: ">= 0"
